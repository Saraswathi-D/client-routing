<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova | Modern Web Solutions</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <a href="#app" class="skip-link">Skip to main content</a>

    <div id="scrollProgress" class="scroll-progress"></div>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <header class="navbar">

        <div class="nav-container">

            <a href="#/" class="logo" data-link>
                <span class="logo-icon">T</span>
                <span>TechNova</span>
            </a>

            <button
                class="menu-btn"
                id="menuBtn"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="navMenu">
                ☰
            </button>

            <nav id="navMenu" aria-label="Main navigation">

                <a href="#/" data-link class="nav-link">
                    Home
                </a>

                <a href="#/about" data-link class="nav-link">
                    About
                </a>

                <a href="#/services" data-link class="nav-link">
                    Services
                </a>

                <a href="#/contact" data-link class="nav-link">
                    Contact
                </a>

            </nav>

            <button
                id="themeToggle"
                class="theme-btn"
                aria-label="Switch to dark mode">
                🌙
            </button>

        </div>

    </header>

    <main id="app" tabindex="-1"></main>

    <footer>

        <div class="footer-container">

            <div>
                <h3>TechNova</h3>
                <p>
                    Building modern and innovative digital solutions.
                </p>
            </div>

            <div>
                <p>© 2026 TechNova. All Rights Reserved.</p>
            </div>

        </div>

    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite">
        Message sent successfully!
    </div>

    <button id="backToTop" class="back-to-top" aria-label="Back to top">
        ↑
    </button>

    <script src="script.js"></script>

</body>
</html>
